<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Gestão Escolar - Cronograma e Plano Quinzenal</title>
  <style>
    :root {
      --navy: #1f2a44;
      --navy-light: #2c3a5f;
      --accent: #c78b6c;
      --bg: #f4f5f8;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 24px;
      color: #1f2a44;
    }

    /* ---- ABAS ---- */
    .tabs-bar {
      max-width: 1000px;
      margin: 0 auto 14px auto;
      display: flex;
      gap: 10px;
    }
    .tab-nav {
      flex: 1;
      padding: 13px;
      border: none;
      background: var(--navy-light);
      color: #fff;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .tab-nav.active {
      background: var(--navy);
      border-bottom: 4px solid var(--accent);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ---- CONTAINER GERAL ---- */
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .banner { width: 100%; display: block; }

    /* ---- BARRA DE INFORMAÇÕES ---- */
    .info {
      display: flex;
      border-bottom: 1px solid #e3e6ee;
    }
    .info div {
      flex: 1;
      padding: 12px 16px;
      border-right: 1px solid #e3e6ee;
    }
    .info div:last-child { border-right: none; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--navy-light);
      margin-bottom: 5px;
    }
    input[type=text], select, textarea {
      width: 100%;
      padding: 8px 9px;
      border: 1px solid #d7dbe4;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: #fbfbfd;
    }
    textarea { resize: vertical; min-height: 52px; }

    /* ---- ÁREA DE CONTEÚDO ---- */
    .content { padding: 20px 24px; }
    .field-wrap { margin-bottom: 14px; }

    /* ---- SEMANAS (CRONOGRAMA) ---- */
    .week {
      border-radius: 10px;
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid #e3e6ee;
    }
    .week-head {
      padding: 10px 16px;
      font-weight: 700;
      color: var(--navy);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .week-body {
      padding: 14px 16px;
      background: #fff;
      display: none;
      gap: 10px;
    }
    .week-body.open { display: grid; grid-template-columns: 1fr 1fr; }
    .week-body .full { grid-column: 1 / -1; }

    /* cores das semanas */
    .w1 { background: #dbeeff; } .w2 { background: #e9e2f9; }
    .w3 { background: #fdf3d9; } .w4 { background: #e6f4ea; }
    .w5 { background: #dbeeff; } .w6 { background: #e9e2f9; }
    .w7 { background: #fdf3d9; } .w8 { background: #e6f4ea; }

    .chevron { transition: transform .2s; flex-shrink: 0; }
    .open-chevron { transform: rotate(180deg); }

    /* ---- AÇÕES ---- */
    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e3e6ee;
    }
    .btn-main {
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 13px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .5px;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-main:hover { background: var(--navy-light); }
    .btn-main:disabled { opacity: .6; cursor: default; }

    .status-area { font-size: 13px; font-weight: 700; }
    .status-area.error   { color: #b3261e; }
    .status-area.success { color: #1e7a35; }
    .status-area a { color: var(--navy); font-weight: 700; }

    /* ---- SEÇÕES DO PLANO ---- */
    .section-block {
      border: 1px solid #e3e6ee;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .section-title {
      background: #f4f5f8;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--navy-light);
      border-bottom: 1px solid #e3e6ee;
    }
    .section-body { padding: 12px 14px; }
    .section-body textarea {
      min-height: 60px;
    }
  </style>
</head>
<body>

<!-- ===================== ABAS ===================== -->
<div class="tabs-bar">
  <button class="tab-nav active" onclick="openTab('cronogramaView', this)">
    📅 Cronograma do Bimestre
  </button>
  <button class="tab-nav" onclick="openTab('planoView', this)">
    📝 Plano Quinzenal / Mensal
  </button>
</div>


<!-- ========================================================
     ABA 1 — CRONOGRAMA DO BIMESTRE
     ======================================================== -->
<div id="cronogramaView" class="tab-content active">
  <div class="wrap">

    <img class="banner" id="banner-cr" alt="Banner Cronograma do Bimestre">

    <div class="info">
      <div>
        <label>Professor(a)</label>
        <input type="text" id="cr_professor" placeholder="Nome completo do professor(a)">
      </div>
      <div>
        <label>Componente</label>
        <input type="text" id="cr_componente" placeholder="Ex: Ciências">
      </div>
      <div>
        <label>Ano/Série/Turma</label>
        <input type="text" id="cr_turma" placeholder="Ex: 8º Ano A">
      </div>
      <div>
        <label>Bimestre / Período</label>
        <input type="text" id="cr_bimestre" placeholder="Ex: 3º Bimestre">
      </div>
    </div>

    <div class="content">
      <div id="semanas-container"></div>
      <div class="actions">
        <button class="btn-main" id="btn-cr" onclick="enviarCronograma()">
          📄 Gerar PDF &amp; Salvar no Drive
        </button>
        <div id="status-cr" class="status-area"></div>
      </div>
    </div>

  </div>
</div>


<!-- ========================================================
     ABA 2 — PLANO QUINZENAL / MENSAL
     ======================================================== -->
<div id="planoView" class="tab-content">
  <div class="wrap">

    <img class="banner" id="banner-pl" alt="Banner Plano Quinzenal / Mensal">

    <!-- CABEÇALHO DE INFORMAÇÕES: Professor, Componente, Turma -->
    <div class="info">
      <div style="flex: 2;">
        <label>Professor(a)</label>
        <input type="text" id="pl_professor" placeholder="Nome completo do professor(a)">
      </div>
      <div style="flex: 2;">
        <label>Componente</label>
        <input type="text" id="pl_componente" placeholder="Ex: Matemática">
      </div>
      <div style="flex: 2;">
        <label>Ano/Série/Turma</label>
        <input type="text" id="pl_turma" placeholder="Ex: 9º Ano B">
      </div>
    </div>

    <!-- LINHA DE DADOS COMPLEMENTARES: Quantidade de aulas, Período realização -->
    <div class="info">
      <div>
        <label>Quantidade de aulas</label>
        <input type="text" id="pl_qtdAulas" placeholder="Ex: 12 a 13 aulas">
      </div>
      <div>
        <label>Período realização</label>
        <input type="text" id="pl_periodo" placeholder="Ex: 24/07/2026 a 24/08/2026">
      </div>
    </div>

    <div class="content">

      <div class="section-block">
        <div class="section-title">Conteúdo/Aulas</div>
        <div class="section-body">
          <textarea id="pl_conteudo" rows="3" placeholder="Descreva os conteúdos/aulas..."></textarea>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">Objetivo(s)</div>
        <div class="section-body">
          <textarea id="pl_objetivos" rows="3" placeholder="Descreva os objetivos de aprendizagem..."></textarea>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">Aprendizagens essenciais</div>
        <div class="section-body">
          <textarea id="pl_aprendizagens" rows="3" placeholder="Liste as aprendizagens essenciais..."></textarea>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">Habilidade priorizada</div>
        <div class="section-body">
          <textarea id="pl_habilidades" rows="3" placeholder="Ex: EF08CI01 — ..."></textarea>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">Conhecimentos Prévios</div>
        <div class="section-body">
          <textarea id="pl_conhecimentos" rows="3" placeholder="Indique os conhecimentos prévios..."></textarea>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">Recursos Didáticos</div>
        <div class="section-body">
          <textarea id="pl_recursos" rows="2" placeholder="Ex: Livro didático, Caderno, Projetor, Material impresso..."></textarea>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">Metodologia (Desenvolvimento/Estratégias)</div>
        <div class="section-body">
          <textarea id="pl_metodologia" rows="5" placeholder="Descreva as estratégias e o desenvolvimento das aulas..."></textarea>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">Avaliação</div>
        <div class="section-body">
          <textarea id="pl_avaliacao" rows="3" placeholder="Descreva os instrumentos e critérios de avaliação..."></textarea>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">Observação</div>
        <div class="section-body">
          <textarea id="pl_observacao" rows="2" placeholder="Observações adicionais..."></textarea>
        </div>
      </div>

      <div class="actions">
        <button class="btn-main" id="btn-pl" onclick="enviarPlano()">
          📄 Gerar PDF &amp; Salvar no Drive
        </button>
        <div id="status-pl" class="status-area"></div>
      </div>

    </div>
  </div>
</div>


<!-- ========================================================
     SCRIPTS
     ======================================================== -->
<script>
  /* -------------------------------------------------------
     URL DO GOOGLE APPS SCRIPT WEBAPP
     ------------------------------------------------------- */
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6BKzm6cM8_Aq6_kKRGxtDD-9Yu5xU86yxnGIcgSp_EhtzGDxx5LiT9dPqt6eHeNUP/exec";

  /* Banners */
  var BANNER_CRONOGRAMA = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhSsq0k46KyBl2lNndJO5xhEMnwQbaBH7KumrABc7jDPgH8fEW_r4imFWN7DYkoEFR8m-Xq7Ir7fSmm9c4n8vK2ltYx8eE2GbhyhyphenhyphenR4CvuzT22lEj-SNrA-w_mgXUlzOG82fFJrfmVZdKAaPCKQ8n9I-NhjrH2KFhhTLEgSFuN4ZPNYQ96gk10VDeCKw0MO/s2171/ChatGPT%20Image%2031%20de%20jul.%20de%202026,%2023_51_10.png";
  var BANNER_PLANO      = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi2VqYtjG40_QrdKzqgqN7IVTxmrvfvrcz2p_rZp2W8Deicf-uXtVty-W4OCMGVVAaG16Tei9M4vsPPzDXJdj7q0U-CWQagMVtbR1S-FsCDMcY2gi1cQC60CnoAIK2XhxGkKr7YT0-2Qln1-tTwRgumbr70TMWEB-V-2c8C1TYbtbFxcj1eTIs65d8eeMar/s997/LOGO%20SP.PNG";

  document.addEventListener('DOMContentLoaded', function() {
    var imgCr = document.getElementById('banner-cr');
    var imgPl = document.getElementById('banner-pl');
    if (imgCr) imgCr.src = BANNER_CRONOGRAMA;
    if (imgPl) imgPl.src = BANNER_PLANO;
  });

  /* -------------------------------------------------------
     GERAR 8 SEMANAS DO CRONOGRAMA
     ------------------------------------------------------- */
  (function() {
    var cores = ['w1','w2','w3','w4','w5','w6','w7','w8'];
    var cont  = document.getElementById('semanas-container');
    for (var i = 1; i <= 8; i++) {
      var c = cores[i - 1];
      var div = document.createElement('div');
      div.innerHTML = [
        '<div class="week">',
          '<div class="week-head ' + c + '" onclick="toggleWeek(' + i + ')">',
            '<span>SEMANA ' + i + '</span>',
            '<svg id="chev' + i + '" class="chevron" width="18" height="18" viewBox="0 0 24 24"',
                 'fill="none" stroke="currentColor" stroke-width="2.5">',
              '<polyline points="6 9 12 15 18 9"/>',
            '</svg>',
          '</div>',
          '<div class="week-body" id="body' + i + '">',
            '<div>',
              '<label>Conteúdo / Objeto de Conhecimento</label>',
              '<textarea id="s' + i + '_conteudo" rows="2"></textarea>',
            '</div>',
            '<div>',
              '<label>Habilidade priorizada / Aprendizagens essenciais</label>',
              '<textarea id="s' + i + '_habilidades" rows="2"></textarea>',
            '</div>',
            '<div class="full">',
              '<label>Metodologia (Desenvolvimento/Estratégias) / Recursos Didáticos</label>',
              '<textarea id="s' + i + '_metodologia" rows="3"></textarea>',
            '</div>',
            '<div class="full">',
              '<label>Avaliação / Entregáveis do Aluno</label>',
              '<textarea id="s' + i + '_avaliacao" rows="2"></textarea>',
            '</div>',
          '</div>',
        '</div>'
      ].join('');
      cont.appendChild(div.firstChild);
    }
  })();

  function toggleWeek(n) {
    var body = document.getElementById('body' + n);
    var chev = document.getElementById('chev' + n);
    var aberto = body.classList.contains('open');
    body.classList.toggle('open', !aberto);
    chev.classList.toggle('open-chevron', !aberto);
  }

  function openTab(id, btn) {
    document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
    document.querySelectorAll('.tab-nav').forEach(function(el) { el.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }

  function coletarCronograma() {
    var d = {
      professor:  document.getElementById('cr_professor').value,
      componente: document.getElementById('cr_componente').value,
      turma:      document.getElementById('cr_turma').value,
      bimestre:   document.getElementById('cr_bimestre').value
    };
    for (var i = 1; i <= 8; i++) {
      d['semana_' + i + '_conteudo']    = document.getElementById('s' + i + '_conteudo').value;
      d['semana_' + i + '_habilidades'] = document.getElementById('s' + i + '_habilidades').value;
      d['semana_' + i + '_metodologia'] = document.getElementById('s' + i + '_metodologia').value;
      d['semana_' + i + '_avaliacao']   = document.getElementById('s' + i + '_avaliacao').value;
    }
    return d;
  }

  function coletarPlano() {
    var valQtd = document.getElementById('pl_qtdAulas').value;
    return {
      professor:            document.getElementById('pl_professor').value,
      componente:           document.getElementById('pl_componente').value,
      turma:                document.getElementById('pl_turma').value,
      quantidadeAulas:      valQtd,
      qtdAulas:             valQtd,
      periodo:              document.getElementById('pl_periodo').value,
      conteudo:             document.getElementById('pl_conteudo').value,
      objetivos:            document.getElementById('pl_objetivos').value,
      aprendizagens:        document.getElementById('pl_aprendizagens').value,
      habilidades:          document.getElementById('pl_habilidades').value,
      conhecimentosPrevios: document.getElementById('pl_conhecimentos').value,
      recursos:             document.getElementById('pl_recursos').value,
      metodologia:          document.getElementById('pl_metodologia').value,
      avaliacao:            document.getElementById('pl_avaliacao').value,
      observacao:           document.getElementById('pl_observacao').value
    };
  }

  /* -------------------------------------------------------
     COMUNICAÇÃO COM O SERVIDOR (GITHUB + GOOGLE APPS SCRIPT)
     ------------------------------------------------------- */
  function enviarServidor(acao, dados, callbackSucesso, callbackErro) {
    if (typeof google !== 'undefined' && google && google.script && google.script.run) {
      if (acao === 'cronograma') {
        google.script.run.withSuccessHandler(callbackSucesso).withFailureHandler(callbackErro).gerarPdfCronograma(dados);
      } else {
        google.script.run.withSuccessHandler(callbackSucesso).withFailureHandler(callbackErro).gerarPdfPlanoQuinzenal(dados);
      }
    } else {
      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ acao: acao, dados: dados })
      })
      .then(function(res) { return res.json(); })
      .then(callbackSucesso)
      .catch(callbackErro);
    }
  }

  function enviarCronograma() {
    var status = document.getElementById('status-cr');
    var btn    = document.getElementById('btn-cr');
    var dados  = coletarCronograma();
    if (!dados.professor.trim()) { alert('Preencha o nome do professor(a).'); return; }
    btn.disabled = true;
    status.className = 'status-area';
    status.innerHTML = '⏳ Gerando PDF e salvando no Google Drive...';

    enviarServidor('cronograma', dados, function(r) {
      btn.disabled = false;
      if (r && r.sucesso) {
        status.className = 'status-area success';
        status.innerHTML = '✅ Salvo na pasta <b>"' + r.nomePasta + '"</b>! ' +
          '<a href="' + r.urlArquivo + '" target="_blank">📄 Abrir PDF</a>';
      } else {
        status.className = 'status-area error';
        status.innerHTML = '❌ Erro: ' + (r ? r.mensagem : 'Erro desconhecido');
      }
    }, function(e) {
      btn.disabled = false;
      status.className = 'status-area error';
      status.innerHTML = '❌ Erro inesperado: ' + e.toString();
    });
  }

  function enviarPlano() {
    var status = document.getElementById('status-pl');
    var btn    = document.getElementById('btn-pl');
    var dados  = coletarPlano();
    if (!dados.professor.trim()) { alert('Preencha o nome do professor(a).'); return; }
    btn.disabled = true;
    status.className = 'status-area';
    status.innerHTML = '⏳ Gerando PDF e salvando no Google Drive...';

    enviarServidor('plano', dados, function(r) {
      btn.disabled = false;
      if (r && r.sucesso) {
        status.className = 'status-area success';
        status.innerHTML = '✅ Salvo na pasta <b>"' + r.nomePasta + '"</b>! ' +
          '<a href="' + r.urlArquivo + '" target="_blank">📄 Abrir PDF</a>';
      } else {
        status.className = 'status-area error';
        status.innerHTML = '❌ Erro: ' + (r ? r.mensagem : 'Erro desconhecido');
      }
    }, function(e) {
      btn.disabled = false;
      status.className = 'status-area error';
      status.innerHTML = '❌ Erro inesperado: ' + e.toString();
    });
  }
</script>

</body>
</html>
