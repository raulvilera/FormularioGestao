<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root{
      --navy:#1f2a44;
      --navy-light:#2c3a5f;
      --accent:#c78b6c;
      --bg:#f4f5f8;
    }
    *{box-sizing:border-box;}
    body{
      font-family:'Segoe UI', Arial, sans-serif;
      background:var(--bg);
      margin:0;
      padding:24px;
      color:#1f2a44;
    }
    .wrap{max-width:1000px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);}
    .banner{width:100%;display:block;}
    .info{
      display:flex;
      border-bottom:1px solid #e3e6ee;
    }
    .info div{
      flex:1;
      padding:12px 16px;
      border-right:1px solid #e3e6ee;
    }
    .info div:last-child{border-right:none;}
    label{
      display:block;
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.5px;
      color:var(--navy-light);
      margin-bottom:5px;
    }
    input[type=text], select, textarea{
      width:100%;
      padding:8px 9px;
      border:1px solid #d7dbe4;
      border-radius:6px;
      font-size:14px;
      font-family:inherit;
      background:#fbfbfd;
    }
    textarea{resize:vertical;min-height:44px;}
    .icon-bar{width:100%;display:block;margin-top:2px;}
    .content{padding:20px 24px;}
    .week{
      border-radius:10px;
      margin-bottom:14px;
      overflow:hidden;
      border:1px solid #e3e6ee;
    }
    .week-head{
      padding:10px 16px;
      font-weight:700;
      color:var(--navy);
      cursor:pointer;
      display:flex;
      justify-content:space-between;
      align-items:center;
      user-select:none;
    }
    .week-body{
      padding:14px 16px;
      background:#fff;
      display:none;
      gap:10px;
    }
    .week-body.open{display:grid;grid-template-columns:1fr 1fr;}
    .week-body .full{grid-column:1 / -1;}
    .w1{background:#dbeeff;} .w2{background:#e9e2f9;} .w3{background:#fdf3d9;} .w4{background:#e6f4ea;}
    .w5{background:#dbeeff;} .w6{background:#e9e2f9;} .w7{background:#fdf3d9;} .w8{background:#e6f4ea;}
    .chevron{transition:transform .2s;}
    .open-chevron{transform:rotate(180deg);}
    .actions{
      display:flex;
      align-items:center;
      gap:14px;
      margin-top:18px;
    }
    button{
      background:var(--navy);
      color:#fff;
      border:none;
      padding:12px 26px;
      border-radius:8px;
      font-size:14px;
      font-weight:700;
      letter-spacing:.5px;
      cursor:pointer;
    }
    button:disabled{opacity:.6;cursor:default;}
    #status{font-size:13px;}
    #status.error{color:#b3261e;}
    #status.success{color:#1e7a35;}
    #status a{color:var(--navy);font-weight:700;}
  </style>
</head>

  <div class="content">
    <div id="weeks"></div>

    <div class="actions">
      <button id="submitBtn" onclick="enviar()">Gerar e enviar PDF</button>
      <span id="status"></span>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw6KqumYzw5apMUPtRjBWbe8mXD8kjILPI4248_raYCEZu76L_CJ4NqWTYfZr5VT3tLrA/exec';

  const CAMPOS = [
    {key:'conteudo', label:'Conte\u00fado'},
    {key:'aulas', label:'Aulas do Material Digital'},
    {key:'paginas', label:'P\u00e1ginas do Livro do Estudante'},
    {key:'plataformas', label:'Plataformas e Tarefas Digitais'},
    {key:'observacoes', label:'Observa\u00e7\u00f5es', full:true}
  ];

  const weeksEl = document.getElementById('weeks');
  for (let i = 1; i <= 8; i++) {
    const div = document.createElement('div');
    div.className = 'week';
    div.innerHTML = `
      <div class="week-head w${i}" onclick="toggleWeek(${i})">
        <span>Semana ${i}</span>
        <span class="chevron" id="chev${i}">▾</span>
      </div>
      <div class="week-body" id="body${i}">
        ${CAMPOS.map(c => `
          <div class="${c.full ? 'full' : ''}">
            <label>${c.label}</label>
            <textarea id="s${i}_${c.key}"></textarea>
          </div>`).join('')}
      </div>`;
    weeksEl.appendChild(div);
  }
  // Abre a Semana 1 por padrão
  document.getElementById('body1').classList.add('open');
  document.getElementById('chev1').classList.add('open-chevron');

  function toggleWeek(i) {
    document.getElementById('body' + i).classList.toggle('open');
    document.getElementById('chev' + i).classList.toggle('open-chevron');
  }

  function enviar() {
    const professor = document.getElementById('professor').value.trim();
    if (!professor) {
      setStatus('Digite seu nome completo antes de enviar.', 'error');
      return;
    }

    const data = {
      professor: professor,
      componente: document.getElementById('componente').value,
      bimestre: document.getElementById('bimestre').value,
      turma: document.getElementById('turma').value,
      semanas: []
    };

    for (let i = 1; i <= 8; i++) {
      const w = {};
      CAMPOS.forEach(c => w[c.key] = document.getElementById(`s${i}_${c.key}`).value);
      data.semanas.push(w);
    }

    document.getElementById('submitBtn').disabled = true;
    setStatus('Gerando PDF e enviando para o Drive...', '');

    // Content-Type "text/plain" evita o preflight OPTIONS,
    // que o Web App do Apps Script não trata por padrão.
    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    })
      .then(function (resp) {
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.json();
      })
      .then(onSuccess)
      .catch(onFailure);
  }

  function onSuccess(res) {
    document.getElementById('submitBtn').disabled = false;
    if (res && res.success) {
      setStatus('Enviado! Arquivo salvo como "' + res.fileName + '". <a href="' + res.fileUrl + '" target="_blank">Abrir PDF</a>', 'success');
    } else {
      setStatus('Erro: ' + (res && res.error ? res.error : 'resposta inesperada do servidor'), 'error');
    }
  }

  function onFailure(err) {
    document.getElementById('submitBtn').disabled = false;
    setStatus('Erro inesperado: ' + err.message, 'error');
  }

  function setStatus(msg, cls) {
    const el = document.getElementById('status');
    el.innerHTML = msg;
    el.className = cls;
  }
</script>
</body>
</html>
